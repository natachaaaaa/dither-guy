name: Build Dither Guy Executables

on:
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  _EXCLUDES: >-
    --exclude-module=PySide6.Qt3DAnimation
    --exclude-module=PySide6.Qt3DCore
    --exclude-module=PySide6.Qt3DExtras
    --exclude-module=PySide6.Qt3DInput
    --exclude-module=PySide6.Qt3DLogic
    --exclude-module=PySide6.Qt3DRender
    --exclude-module=PySide6.QtBluetooth
    --exclude-module=PySide6.QtCharts
    --exclude-module=PySide6.QtDataVisualization
    --exclude-module=PySide6.QtDesigner
    --exclude-module=PySide6.QtHelp
    --exclude-module=PySide6.QtLocation
    --exclude-module=PySide6.QtNfc
    --exclude-module=PySide6.QtPdf
    --exclude-module=PySide6.QtPdfWidgets
    --exclude-module=PySide6.QtPositioning
    --exclude-module=PySide6.QtQml
    --exclude-module=PySide6.QtQuick
    --exclude-module=PySide6.QtQuickControls2
    --exclude-module=PySide6.QtQuickWidgets
    --exclude-module=PySide6.QtRemoteObjects
    --exclude-module=PySide6.QtSensors
    --exclude-module=PySide6.QtSerialBus
    --exclude-module=PySide6.QtSerialPort
    --exclude-module=PySide6.QtSql
    --exclude-module=PySide6.QtStateMachine
    --exclude-module=PySide6.QtTest
    --exclude-module=PySide6.QtTextToSpeech
    --exclude-module=PySide6.QtWebChannel
    --exclude-module=PySide6.QtWebEngineCore
    --exclude-module=PySide6.QtWebEngineQuick
    --exclude-module=PySide6.QtWebEngineWidgets
    --exclude-module=PySide6.QtWebSockets
    --exclude-module=PySide6.QtXml
    --exclude-module=cv2.gapi
    --exclude-module=cv2.cuda
    --exclude-module=tkinter
    --exclude-module=matplotlib
    --exclude-module=scipy
    --exclude-module=pandas

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  build-windows:
    needs: tests
    runs-on: windows-latest
    strategy:
      matrix:
        gpu: [universal, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UPX
        run: choco install upx --no-progress -y
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Install CuPy (CUDA Build)
        if: matrix.gpu == 'cuda'
        run: pip install cupy-cuda12x
      - name: Build
        shell: pwsh
        run: |
          $excludesStr = $env:_EXCLUDES
          if ('${{ matrix.gpu }}' -eq 'universal') {
              $excludesStr += " --exclude-module=cupy --exclude-module=cupy_cuda11x --exclude-module=cupy_cuda12x"
          }
          $excludes = $excludesStr -split '\s+' | Where-Object { $_ }
          $name = "DitherGuy"
          if ('${{ matrix.gpu }}' -eq 'cuda') {
              $name = "DitherGuy-CUDA"
              $excludesStr += " --collect-all=cupy --hidden-import=cupy"
          }
          $args = @(
            '--clean', '--noconfirm',
            "--name=$name",
            '--onefile', '--windowed', '--noconsole',
            '--icon=app_icon.png', '--add-data=app_icon.png;.', '--add-data=fonts;fonts', '--add-data=presets;presets', '--hidden-import=utils.fx', '--hidden-import=utils.pipeline', '--hidden-import=utils.gradients', '--hidden-import=utils.export', '--hidden-import=utils.ui_extras', '--hidden-import=utils.ui_preset_browser',
            '--hidden-import=PySide6.QtCore', '--hidden-import=PySide6.QtGui', '--hidden-import=PySide6.QtWidgets',
            '--hidden-import=PIL', '--hidden-import=PIL.Image', '--hidden-import=PIL.ImageFilter', '--hidden-import=PIL.ImageEnhance',
            '--hidden-import=numpy', '--hidden-import=cv2', '--hidden-import=shiboken6',
            '--hidden-import=utils', '--hidden-import=utils.constants', '--hidden-import=utils.palettes',
            '--hidden-import=utils.matrices', '--hidden-import=utils.dither_kernels', '--hidden-import=utils.gpu_kernels',
            '--hidden-import=utils.presets', '--hidden-import=utils.batch', '--hidden-import=utils.theme',
            '--hidden-import=utils.workers', '--hidden-import=utils.ui_widgets', '--hidden-import=utils.ui_control_panel',
            '--hidden-import=utils.ui_tabs', '--hidden-import=utils.ui_dialogs',
            '--hidden-import=ui', '--hidden-import=ui.window', '--hidden-import=ui.toolbar', '--hidden-import=ui.handlers',
            '--collect-all=PySide6.QtMultimedia', '--hidden-import=PySide6.QtMultimedia',
            '--collect-all=numba', '--hidden-import=numba.cuda', '--hidden-import=numba._devicearray'
          ) + $excludes + @('main.py')
          & pyinstaller @args
      - name: Smoke-test the built .exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'DitherGuy*.exe' | Select-Object -First 1
          if (-not $exe) { throw "No .exe was produced" }
          "Built: $($exe.Name)  ($([math]::Round($exe.Length / 1MB, 1)) MB)"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { "no self-test report written" }
          if ($p.ExitCode -ne 0) { throw "Self-test of the built executable failed (exit code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: DitherGuy-Windows-${{ matrix.gpu }}
          path: dist/DitherGuy*.exe
          retention-days: 7

  build-linux:
    needs: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gpu: [universal, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-image0             libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0             libxkbcommon-x11-0 libxcb-xkb1 libegl1 libfontconfig1 libdbus-1-3             upx-ucl
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Install CuPy (CUDA Build)
        if: matrix.gpu == 'cuda'
        run: pip install cupy-cuda12x
      - name: Build
        run: |
          EXCLUDES="${{ env._EXCLUDES }}"
          NAME="DitherGuy"
          if [ "${{ matrix.gpu }}" = "universal" ]; then
              EXCLUDES="$EXCLUDES --exclude-module=cupy --exclude-module=cupy_cuda11x --exclude-module=cupy_cuda12x"
          else
              NAME="DitherGuy-CUDA"
              EXCLUDES="$EXCLUDES --collect-all=cupy --hidden-import=cupy"
          fi
          pyinstaller --clean --noconfirm \
            --name="$NAME" \
            --onefile --windowed --strip \
            --add-data=fonts:fonts --add-data=presets:presets --hidden-import=utils.fx --hidden-import=utils.pipeline --hidden-import=utils.gradients --hidden-import=utils.export --hidden-import=utils.ui_extras --hidden-import=utils.ui_preset_browser \
            --hidden-import=PySide6.QtCore --hidden-import=PySide6.QtGui --hidden-import=PySide6.QtWidgets \
            --hidden-import=PIL --hidden-import=PIL.Image --hidden-import=PIL.ImageFilter --hidden-import=PIL.ImageEnhance \
            --hidden-import=numpy --hidden-import=cv2 --hidden-import=shiboken6 \
            --hidden-import=utils --hidden-import=utils.constants --hidden-import=utils.palettes \
            --hidden-import=utils.matrices --hidden-import=utils.dither_kernels --hidden-import=utils.gpu_kernels \
            --hidden-import=utils.presets --hidden-import=utils.batch --hidden-import=utils.theme \
            --hidden-import=utils.workers --hidden-import=utils.ui_widgets --hidden-import=utils.ui_control_panel \
            --hidden-import=utils.ui_tabs --hidden-import=utils.ui_dialogs \
            --hidden-import=ui --hidden-import=ui.window --hidden-import=ui.toolbar --hidden-import=ui.handlers \
            --collect-all=PySide6.QtMultimedia --hidden-import=PySide6.QtMultimedia \
            --collect-all=numba --hidden-import=numba.cuda --hidden-import=numba._devicearray \
            $EXCLUDES main.py
      - name: Make executable
        run: chmod +x dist/DitherGuy*
      - name: Smoke-test the built binary
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          BIN=$(ls dist/DitherGuy* | head -n 1)
          CODE=0; "$BIN" --selftest "$PWD/selftest.txt" || CODE=$?
          cat selftest.txt || true
          exit $CODE
      - uses: actions/upload-artifact@v4
        with:
          name: DitherGuy-Linux-${{ matrix.gpu }}
          path: dist/DitherGuy*
          retention-days: 7

  build-macos:
    needs: tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UPX
        run: brew install upx
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt
      - name: Build
        run: |
          EXCLUDES="${{ env._EXCLUDES }} --exclude-module=cupy --exclude-module=cupy_cuda11x --exclude-module=cupy_cuda12x"
          pyinstaller --clean --noconfirm \
            --name="DitherGuy" \
            --onefile --windowed --strip \
            --add-data=fonts:fonts --add-data=presets:presets --hidden-import=utils.fx --hidden-import=utils.pipeline --hidden-import=utils.gradients --hidden-import=utils.export --hidden-import=utils.ui_extras --hidden-import=utils.ui_preset_browser \
            --hidden-import=PySide6.QtCore --hidden-import=PySide6.QtGui --hidden-import=PySide6.QtWidgets \
            --hidden-import=PIL --hidden-import=PIL.Image --hidden-import=PIL.ImageFilter --hidden-import=PIL.ImageEnhance \
            --hidden-import=numpy --hidden-import=cv2 --hidden-import=shiboken6 \
            --hidden-import=utils --hidden-import=utils.constants --hidden-import=utils.palettes \
            --hidden-import=utils.matrices --hidden-import=utils.dither_kernels --hidden-import=utils.gpu_kernels \
            --hidden-import=utils.presets --hidden-import=utils.batch --hidden-import=utils.theme \
            --hidden-import=utils.workers --hidden-import=utils.ui_widgets --hidden-import=utils.ui_control_panel \
            --hidden-import=utils.ui_tabs --hidden-import=utils.ui_dialogs \
            --hidden-import=ui --hidden-import=ui.window --hidden-import=ui.toolbar --hidden-import=ui.handlers \
            --collect-all=PySide6.QtMultimedia --hidden-import=PySide6.QtMultimedia \
            --collect-all=numba --hidden-import=numba.cuda --hidden-import=numba._devicearray \
            $EXCLUDES main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DitherGuy-macOS
          path: dist/DitherGuy
          retention-days: 7

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rename platform binaries
        run: |
          mv artifacts/DitherGuy-Windows-universal/DitherGuy.exe         artifacts/DitherGuy-Windows-universal/DitherGuy-Windows.exe
          mv artifacts/DitherGuy-Windows-cuda/DitherGuy-CUDA.exe         artifacts/DitherGuy-Windows-cuda/DitherGuy-Windows-CUDA.exe
          mv artifacts/DitherGuy-Linux-universal/DitherGuy               artifacts/DitherGuy-Linux-universal/DitherGuy-Linux
          mv artifacts/DitherGuy-Linux-cuda/DitherGuy-CUDA               artifacts/DitherGuy-Linux-cuda/DitherGuy-Linux-CUDA
          mv artifacts/DitherGuy-macOS/DitherGuy                         artifacts/DitherGuy-macOS/DitherGuy-macOS
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/DitherGuy-Windows-universal/DitherGuy-Windows.exe
            artifacts/DitherGuy-Windows-cuda/DitherGuy-Windows-CUDA.exe
            artifacts/DitherGuy-Linux-universal/DitherGuy-Linux
            artifacts/DitherGuy-Linux-cuda/DitherGuy-Linux-CUDA
            artifacts/DitherGuy-macOS/DitherGuy-macOS
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
